<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>เช็กด่วน: สายนี้ใช่มิจฉาชีพไหม</title>
<style>
:root{--bg:#fff;--fg:#111;--card:#f3f4f6;--line:#d1d5db;--pri:#1d4ed8;--onpri:#fff;--hi:#b91c1c;--hibg:#fee2e2;--md:#92400e;--mdbg:#fef3c7;--lo:#166534;--lobg:#dcfce7;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#000;--fg:#f5f5f5;--card:#1c1c1e;--line:#3a3a3c;--pri:#60a5fa;--onpri:#000;--hi:#fca5a5;--hibg:#450a0a;--md:#fcd34d;--mdbg:#422006;--lo:#86efac;--lobg:#052e16}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#000;--fg:#f5f5f5;--card:#1c1c1e;--line:#3a3a3c;--pri:#60a5fa;--onpri:#000;--hi:#fca5a5;--hibg:#450a0a;--md:#fcd34d;--mdbg:#422006;--lo:#86efac;--lobg:#052e16}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:"Noto Sans Thai","Sarabun",system-ui,sans-serif;font-size:20px;line-height:1.6;min-height:100%}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:26px;line-height:1.3;margin:8px 0 12px}
h2{font-size:22px;margin:20px 0 8px}
p{margin:8px 0}
.top{display:flex;justify-content:flex-end}
.tg{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font:inherit;font-size:16px}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:18px;font:inherit;font-weight:700;font-size:22px;background:var(--pri);color:var(--onpri);text-align:center;text-decoration:none;margin:10px 0}
.btn.alt{background:var(--card);color:var(--fg);border:2px solid var(--line)}
.row{display:flex;gap:12px}.row .btn{margin:10px 0}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;background:var(--pri)}
.q{font-size:26px;font-weight:700;line-height:1.4;margin:16px 0}
.grid{display:grid;gap:10px}
.opt{display:block;width:100%;text-align:left;border:2px solid var(--line);background:var(--card);color:var(--fg);border-radius:14px;padding:14px 16px;font:inherit;font-size:20px}
.res{border-radius:16px;padding:16px;margin:12px 0;border:2px solid}
.res.hi{background:var(--hibg);color:var(--hi);border-color:var(--hi)}
.res.md{background:var(--mdbg);color:var(--md);border-color:var(--md)}
.res.lo{background:var(--lobg);color:var(--lo);border-color:var(--lo)}
.res b.t{font-size:26px;display:block}
.num{font-size:34px;font-weight:800;letter-spacing:1px}
ul{padding-left:22px;margin:8px 0}li{margin:6px 0}
small{font-size:16px;opacity:.85;display:block}
</style>
</head>
<body>
<main>
<div class="top"><button class="tg" id="tg" type="button">เปลี่ยนสี: ขาว/ดำ</button></div>
<div id="app"></div>
</main>
<script>
var Q=[
["เขาโทรมาหาคุณก่อน โดยที่คุณไม่ได้ติดต่อไปใช่ไหม",0],
["เขารีบเร่งให้ตัดสินใจทันที ไม่งั้นจะมีผลเสียใช่ไหม",0],
["เขาให้โอนเงิน หรือสแกน QR จ่ายเงินใช่ไหม",1],
["เขาขอรหัส OTP รหัสผ่าน รหัส PIN หรือเลขบัตรใช่ไหม",1],
["เขาบอกว่าคุณมีคดี พัสดุผิดกฎหมาย หรือบัญชีมีปัญหาใช่ไหม",0],
["เขาให้ติดตั้งแอป กดลิงก์ เพิ่มเพื่อนไลน์ หรือแชร์หน้าจอใช่ไหม",1],
["เขาบอกว่าห้ามบอกใคร หรือห้ามวางสายใช่ไหม",0],
["เบอร์ที่โทรมาเป็นเบอร์แปลก เบอร์ต่างประเทศ (ขึ้นต้น +) หรือไม่รู้จักใช่ไหม",0],
["เขาให้โอนเข้าบัญชีของคนทั่วไป ไม่ใช่บัญชีบริษัทหรือหน่วยงานใช่ไหม",0],
["เขาสัญญาว่าจะได้เงิน รางวัล หรืองานง่ายรายได้ดีเกินจริงใช่ไหม",0]
];
var A=[
{n:"ตำรวจ / ศาล / อัยการ",t:[["ตำรวจ",["191","191"]],["แจ้งความออนไลน์ (เว็บ)",["thaipoliceonline.go.th","https://www.thaipoliceonline.go.th"]]],f:"ตำรวจ ศาล และอัยการ ไม่แจ้งคดีทางโทรศัพท์ ไม่ให้โอนเงินเพื่อพิสูจน์ตัวเอง และไม่ให้คุยผ่านไลน์ ถ้ามีคดีจริงต้องมีหมายเรียกเป็นเอกสารส่งถึงบ้าน"},
{n:"กรมสอบสวนคดีพิเศษ (DSI)",t:[["DSI",["1202","1202"]]],f:"DSI ไม่โทรมาให้โอนเงินตรวจสอบ และไม่ให้ย้ายเงินไปบัญชีอื่นเพื่อความปลอดภัย"},
{n:"ปปง. (ฟอกเงิน)",t:[["ปปง.",["1165","1165"]]],f:"ปปง. ไม่โทรให้โอนเงินมาตรวจสอบ ถ้าบอกว่าบัญชีคุณเกี่ยวกับฟอกเงิน ให้วางสายแล้วโทรถามเบอร์ทางการเอง"},
{n:"ธนาคาร",bank:1,t:[["ธนาคารแห่งประเทศไทย (ตรวจสอบเรื่องการเงิน)",["1213","1213"]],["กสิกรไทย",["02-888-8888","028888888"]],["ไทยพาณิชย์",["02-777-7777","027777777"]],["กรุงเทพ",["1333","1333"]],["กรุงศรี",["1572","1572"]],["กรุงไทย",["02-111-1111","021111111"]],["ทีทีบี",["1428","1428"]],["ออมสิน",["1115","1115"]]],f:"ธนาคารไม่ขอ OTP รหัสผ่าน หรือ PIN ทางโทรศัพท์ และไม่ให้โอนเงินไป “บัญชีปลอดภัย” ให้โทรเบอร์หลังบัตรหรือในแอปของธนาคารเอง"},
{n:"กรมสรรพากร",t:[["กรมสรรพากร",["1161","1161"]]],f:"สรรพากรไม่โทรมาให้โอนเงินหรือขอรหัสผ่าน การคืนภาษีทำผ่านระบบทางการ ไม่ผ่านลิงก์ในแชต"},
{n:"ไปรษณีย์ไทย / ขนส่งพัสดุ",t:[["ไปรษณีย์ไทย",["1545","1545"]],["Flash Express",["1436","1436"]],["Kerry Express",["1217","1217"]],["DHL",["1782","1782"]]],f:"บริษัทขนส่งไม่โทรบอกว่าพัสดุผิดกฎหมาย และไม่ให้โอนเงินปล่อยพัสดุ ถ้าไม่ได้สั่งของ ไม่ต้องรับสาย ตรวจเลขพัสดุในเว็บหรือแอปทางการเอง"},
{n:"ศุลกากร",t:[["ศุลกากร",["1164","1164"]]],f:"ศุลกากรไม่โทรให้โอนเงินเพื่อปล่อยของ ถ้ามีเรื่องจริงจะมีเอกสารแจ้งเป็นทางการ"},
{n:"การไฟฟ้า / การประปา",t:[["การไฟฟ้าส่วนภูมิภาค (กฟภ.)",["1129","1129"]],["การไฟฟ้านครหลวง (กฟน.)",["1130","1130"]]],f:"การไฟฟ้าไม่โทรขู่ตัดไฟแล้วให้โอนเงินเข้าบัญชีส่วนตัว ตรวจค่าไฟจากบิลหรือแอปทางการ"},
{n:"ประกันสังคม",t:[["ประกันสังคม",["1506","1506"]]],f:"ประกันสังคมไม่โทรขอรหัสผ่านหรือให้โอนเงินเพื่อรับสิทธิ"},
{n:"ค่ายมือถือ / กสทช.",t:[["AIS",["1175","1175"]],["TrueMove H",["1242","1242"]],["dtac",["1678","1678"]],["กสทช.",["1200","1200"]]],f:"ค่ายมือถือไม่ขู่ว่าจะตัดเบอร์แล้วให้โอนเงิน หรือให้กดลิงก์ยืนยันตัวตน"},
{n:"ไม่รู้ / อื่น ๆ",t:[],f:"หน่วยงานจริงไม่ให้โอนเงิน ไม่ขอรหัส และไม่รีบบีบให้ตัดสินใจทางโทรศัพท์ ถ้าไม่แน่ใจ ให้วางสาย แล้วค้นหาเบอร์ทางการของหน่วยงานนั้นเอง"}
];
var ans=[],i=0,app=document.getElementById("app");
function H(x){return String(x).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function start(){ans=[];i=0;app.innerHTML='<h1>เช็กด่วน: สายนี้ใช่มิจฉาชีพไหม</h1><div class="res md"><b class="t">⚠ ตอนนี้อย่าโอนเงิน อย่าบอกรหัสใดๆ</b>ตอบ 10 คำถามสั้นๆ ใช้เวลาไม่ถึง 1 นาที</div><p>ตอบ “ใช่” หรือ “ไม่ใช่” ตามที่คนในสายพูดอยู่ตอนนี้ ถ้ากำลังคุยอยู่ ให้เปิดโหมดลำโพงแล้วตอบไปได้เลย</p><button class="btn" id="go" type="button">เริ่มตอบคำถาม</button><small>แอปนี้ช่วยประเมินความเสี่ยงเบื้องต้นเท่านั้น ไม่ได้รับประกัน 100%</small>';document.getElementById("go").onclick=ask}
function ask(){var p=Math.round(i/Q.length*100);app.innerHTML='<p>ข้อ '+(i+1)+' จาก '+Q.length+'</p><div class="bar"><i style="width:'+p+'%"></i></div><div class="q">'+H(Q[i][0])+'</div><div class="row"><button class="btn" id="y" type="button">ใช่</button><button class="btn alt" id="n" type="button">ไม่ใช่</button></div>'+(i>0?'<button class="btn alt" id="b" type="button" style="font-size:18px;padding:12px">← ย้อนกลับ</button>':'');
document.getElementById("y").onclick=function(){pick(1)};document.getElementById("n").onclick=function(){pick(0)};var b=document.getElementById("b");if(b)b.onclick=function(){i--;ans.pop();ask()}}
function pick(v){ans.push(v);i++;if(i<Q.length)ask();else who()}
function who(){var h='<h1>คนที่โทรมาอ้างว่ามาจากที่ไหน</h1><p>เลือกอันที่ใกล้เคียงที่สุด</p><div class="grid">';A.forEach(function(a,k){h+='<button class="opt" data-k="'+k+'" type="button">'+H(a.n)+'</button>'});h+='</div>';app.innerHTML=h;
Array.prototype.forEach.call(document.querySelectorAll(".opt"),function(el){el.onclick=function(){var a=A[+el.getAttribute("data-k")];if(a.bank)bankStep(a);else result(a)}})}
function bankStep(a){result(a)}
function result(a){var y=0,crit=0;ans.forEach(function(v,k){if(v){y++;if(Q[k][1])crit++}});var hi=y>=7||crit>0,md=!hi&&y>=4,cls=hi?"hi":md?"md":"lo";
var t=hi?"🚨 เสี่ยงสูงมาก น่าจะเป็นมิจฉาชีพ":md?"⚠ เสี่ยงปานกลาง ระวังไว้ก่อน":"✅ เสี่ยงต่ำ แต่ยังไม่ควรไว้ใจทันที";
var d=hi?(crit>0&&y<7?"เพราะเขาทำสิ่งที่หน่วยงานจริงไม่ทำ (ขอโอนเงิน ขอรหัส หรือให้ติดตั้งแอป/กดลิงก์) ":"")+"คุณตอบ “ใช่” "+y+" จาก 10 ข้อ":"คุณตอบ “ใช่” "+y+" จาก 10 ข้อ";
var h='<h1>ผลการตรวจ</h1><div class="res '+cls+'"><b class="t">'+t+'</b>'+H(d)+'</div>';
if(hi)h+='<div class="box"><b>ทำทันที</b><ul><li>วางสายเดี๋ยวนี้ อย่าโอนเงิน อย่าบอกรหัส</li><li>อย่ากดลิงก์ หรือติดตั้งแอปที่เขาส่งมา</li><li>โทรเบอร์ทางการด้านล่างเพื่อตรวจสอบเอง</li></ul></div>';
else h+='<div class="box"><b>แนะนำ</b><ul><li>ถ้ายังไม่แน่ใจ ให้วางสาย แล้วโทรกลับเบอร์ทางการเอง อย่าโทรกลับเบอร์ที่เขาให้</li><li>ห้ามโอนเงินหรือบอกรหัสทางโทรศัพท์</li></ul></div>';
h+='<h2>หน่วยงานที่คุณเลือก: '+H(a.n)+'</h2><div class="box"><b>ความจริงที่ควรรู้</b><p>'+H(a.f)+'</p></div>';
if(a.t.length){h+='<div class="box"><b>เบอร์ทางการสำหรับตรวจสอบ</b>';a.t.forEach(function(x){var u=x[1][1];var link=/^http/.test(u)?u:"tel:"+u;h+='<p>'+H(x[0])+'<br><a class="num" style="color:var(--pri)" href="'+link+'">'+H(x[1][0])+'</a></p>'});h+='<small>การกดโทรจะตัดสายของมิจฉาชีพไปด้วย ซึ่งเป็นสิ่งที่ควรทำ</small></div>'}
h+='<div class="box"><b>หน่วยงานช่วยเหลือ (ใช้ได้ทุกกรณี)</b><p>ศูนย์ AOC ตำรวจไซเบอร์ โทรได้ 24 ชั่วโมง<br><a class="num" style="color:var(--pri)" href="tel:1441">1441</a></p><p>ตำรวจฉุกเฉิน<br><a class="num" style="color:var(--pri)" href="tel:191">191</a></p><p>ธนาคารแห่งประเทศไทย (ปรึกษาเรื่องการเงิน)<br><a class="num" style="color:var(--pri)" href="tel:1213">1213</a></p></div>';
h+='<div class="box"><b>ถ้าโอนเงินไปแล้ว</b><ul><li>โทร 1441 ทันที เพื่อขออายัดบัญชีคนร้าย ยิ่งเร็วยิ่งมีโอกาสได้เงินคืน</li><li>โทรธนาคารของคุณ แจ้งว่าถูกหลอก</li><li>เก็บหลักฐาน เช่น สลิป ข้อความ เบอร์โทร</li><li>แจ้งความออนไลน์ที่ thaipoliceonline.go.th</li></ul></div>';
h+='<button class="btn alt" id="sh" type="button">คัดลอกข้อความเตือนคนในครอบครัว</button><button class="btn" id="re" type="button">ตรวจใหม่อีกครั้ง</button><small>เบอร์โทรอาจเปลี่ยนได้ ควรตรวจสอบจากเว็บไซต์ทางการของหน่วยงานอีกครั้ง</small>';
app.innerHTML=h;window.scrollTo(0,0);document.getElementById("re").onclick=start;
document.getElementById("sh").onclick=function(){var m="ระวังมิจฉาชีพ! หน่วยงานจริงไม่โทรให้โอนเงิน ไม่ขอ OTP/รหัสผ่าน และไม่ให้ติดตั้งแอปหรือกดลิงก์ ถ้าสงสัยให้วางสายแล้วโทร 1441 (ตำรวจไซเบอร์ 24 ชม.)";var b=this;function ok(){b.textContent="คัดลอกแล้ว ✓"}try{navigator.clipboard.writeText(m).then(ok,function(){prompt("คัดลอกข้อความนี้",m)})}catch(e){prompt("คัดลอกข้อความนี้",m)}}}
var tg=document.getElementById("tg");
tg.onclick=function(){var r=document.documentElement,c=r.getAttribute("data-theme");if(!c)c=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";r.setAttribute("data-theme",c==="dark"?"light":"dark")};
start();
</script>
</body>
</html>
